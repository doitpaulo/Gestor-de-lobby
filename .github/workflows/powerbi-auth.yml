name: Power BI authentication
on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/powerbi*.ts'
      - 'test-powerbi-suite.ts'
      - '.github/workflows/powerbi-auth.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node node_modules/tsx/dist/cli.mjs test-powerbi-suite.ts
      - run: bun run lint
      - run: bun run build
