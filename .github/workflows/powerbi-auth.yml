name: Power BI authentication
on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/powerbi*.ts'
      - 'test-powerbi-suite.ts'
      - '.github/workflows/powerbi-auth.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx test-powerbi-suite.ts
      - run: npm run lint
      - run: npm run build
